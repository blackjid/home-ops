---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.0/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kopia-sync
spec:
  schedule: "0 3 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      activeDeadlineSeconds: 10800
      backoffLimit: 5
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: default
          securityContext:
            fsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          containers:
            - name: kopia-sync
              image: ghcr.io/home-operations/kopia:0.23.1@sha256:27da0a33b44e1b902150a6c963514237217464bb13118a95bb056667be93cda5
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  set -e -o pipefail

                  echo "Setting cache directory: ${KOPIA_CACHE_DIR}"
                  export KOPIA_CACHE_DIRECTORY="${KOPIA_CACHE_DIR}"
                  export KOPIA_LOG_DIR="${KOPIA_CACHE_DIR}/logs"

                  export KOPIA_CHECK_FOR_UPDATES=false

                  echo "Connecting to Kopia repository: ${KOPIA_REPOSITORY}"
                  kopia repository connect filesystem \
                    --path /repository \
                    --password "${KOPIA_PASSWORD}"

                  echo "Starting Kopia synchronization to S3 bucket: ${S3_BUCKET}"
                  kopia repository sync-to s3 \
                    --bucket "${S3_BUCKET}" \
                    --endpoint "${S3_ENDPOINT}" \
                    --parallel=4 \
                    --delete \
                    --no-progress

                  echo "Disconnecting from Kopia repository"
                  kopia repository disconnect

                  echo "Synchronization completed successfully"
              env:
                - name: KOPIA_CHECK_FOR_UPDATES
                  value: "false"
                - name: KOPIA_CACHE_DIR
                  value: /tmp/cache
                - name: HOME
                  value: /tmp
              envFrom:
                - secretRef:
                    name: kopia-sync-s3-secret
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                privileged: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
              volumeMounts:
                - name: repository
                  mountPath: /repository
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: repository
              nfs:
                server: black-station.internal
                path: /volume1/VolsyncKopia
            - name: tmp
              emptyDir: {}
