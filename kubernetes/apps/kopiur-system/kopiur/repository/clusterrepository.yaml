---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: nas
spec:
  allowedNamespaces:
    all: true
  backend:
    filesystem:
      path: /repo
      volume:
        nfs:
          server: black-station.internal
          path: /volume1/VolsyncKopia
  create:
    enabled: false # adopt volsync's existing repo, never re-initialize
  encryption:
    passwordSecretRef:
      name: kopiur-repository-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  maintenance:
    enabled: false # volsync's KopiaMaintenance still owns compaction
  scheduleDefaults:
    timezone: America/Santiago
