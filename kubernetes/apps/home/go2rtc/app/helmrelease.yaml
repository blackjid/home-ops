---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: go2rtc
spec:
  chartRef:
    kind: OCIRepository
    name: go2rtc
  interval: 1h
  values:
    controllers:
      go2rtc:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/alexxit/go2rtc
              tag: 1.9.14@sha256:675c318b23c06fd862a61d262240c9a63436b4050d177ffc68a32710d9e05bae
            args:
              - /bin/sh
              - -c
              - |-
                until nc -z 127.0.0.1 18554; do sleep 1; done
                exec /usr/local/bin/go2rtc -config /config/go2rtc.yaml
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
                spec:
                  initialDelaySeconds: 45
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
          dahua-p2p:
            image:
              repository: ghcr.io/blackjid/dahua-p2p
              tag: 0.3.0@sha256:cc86899fe7ad24820e6143c97f448b3bf19bed2700cdf504f1d7f5b25b991160
            env:
              DAHUA_SERIAL:
                valueFrom:
                  secretKeyRef:
                    name: go2rtc-secret
                    key: DAHUA_SERIAL
              DAHUA_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: go2rtc-secret
                    key: DAHUA_USERNAME
              DAHUA_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: go2rtc-secret
                    key: DAHUA_PASSWORD
              LISTEN_ADDR: 127.0.0.1:18554
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
    defaultPodOptions:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
    service:
      app:
        forceRename: "{{ .Release.Name }}"
        primary: true
        ports:
          http:
            port: 80
            targetPort: 1984
      streams:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 192.168.69.124
        externalTrafficPolicy: Local
        ports:
          streams-rtsp:
            port: 554
            targetPort: 8554
          streams-webrtc-tcp:
            port: 8555
            protocol: TCP
          streams-webrtc-udp:
            port: 8555
            protocol: UDP
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.blkh.dev"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: 80
    persistence:
      config-file:
        type: secret
        name: go2rtc-secret
        advancedMounts:
          go2rtc:
            app:
              - path: /config/go2rtc.yaml
                subPath: go2rtc.yaml
