---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: frigate-media-nfs
spec:
  capacity:
    storage: 1Mi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - nfsvers=3
    - soft
    - nolock
    - timeo=30
    - retrans=3
    - noatime
    - nconnect=8
    - rsize=1048576
    - wsize=1048576
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: frigate-media-nfs
    volumeAttributes:
      server: black-station.internal
      share: /volume1/frigate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frigate-media-nfs
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 1Mi
  volumeName: frigate-media-nfs
