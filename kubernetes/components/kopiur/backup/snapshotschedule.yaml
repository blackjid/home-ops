---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: ${APP}
spec:
  policyRef:
    name: ${APP}
  schedule:
    # Jenkins-style H pins a deterministic per-app minute so schedules spread
    # out instead of every app snapshotting at exactly 04:00:00.
    cron: "H 4 * * *"
    jitter: 2m
    timezone: America/Santiago
