---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: YOLOv9 Model

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish, following the repo YYYY.M.PATCH convention
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  main:
    name: YOLOv9 Model
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./docker/yolov9-onnx
          platforms: linux/amd64
          push: true
          # Keep the manifest a plain single image rather than an index carrying
          # attestations, since this is consumed as a Kubernetes image volume
          provenance: false
          sbom: false
          tags: ghcr.io/${{ github.repository_owner }}/yolov9-onnx:${{ inputs.tag }}
