---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: YOLOv9 Model

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish, semver (1.0.0 for the first build)
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  main:
    name: YOLOv9 Model
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./docker/yolov9-onnx
          platforms: linux/amd64
          push: true
          # Keep the manifest a plain single image rather than an index carrying
          # attestations, since this is consumed as a Kubernetes image volume
          provenance: false
          sbom: false
          tags: ghcr.io/${{ github.repository_owner }}/yolov9-onnx:${{ inputs.tag }}
